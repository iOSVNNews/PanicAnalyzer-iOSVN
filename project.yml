name: PanicAnalyzer
options:
  bundleIdPrefix: com.iosvn
  deploymentTarget:
    iOS: '15.0'
targets:
  PanicAnalyzer:
    type: application
    platform: iOS
    sources:
    - path: Sources
    - path: web
      type: folder
    - path: assets
      type: folder
    - path: Assets.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: PanicAnalyzer
        CFBundleShortVersionString: 2.6.4
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSLocalNetworkUsageDescription: Kết nối tới LocalDevVPN trên chính thiết bị để đọc crash report bằng Remote Pairing.
        NSBonjourServices:
        - _remotepairing._tcp
        - _remotepairing-pairable-host._tcp
        - _panicanalyzerprobe._tcp
        UIBackgroundModes:
        - audio
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIRequiredDeviceCapabilities:
        - arm64
        UISupportedInterfaceOrientations:
        - UIInterfaceOrientationPortrait
        CFBundleDocumentTypes:
        - CFBundleTypeName: Apple Diagnostic Report
          CFBundleTypeRole: Viewer
          LSHandlerRank: Alternate
          CFBundleTypeExtensions:
          - ips
          - crash
          - panic
          - synced
          LSItemContentTypes:
          - public.plain-text
          - public.data
        LSRequiresIPhoneOS: true
        CFBundleDevelopmentRegion: vi
        CFBundlePackageType: APPL
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iosvn.panicanalyzer
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_REQUIRED: 'NO'
        CODE_SIGNING_ALLOWED: 'NO'
        CODE_SIGN_IDENTITY: ''
        OTHER_LDFLAGS: $(inherited) -lc++
    entitlements:
      path: PanicAnalyzer.entitlements
      properties:
        com.apple.security.application-groups:
        - group.com.iosvn.panicanalyzer
    dependencies:
    - target: PanicAnalyzerShare
      embed: true
    - framework: PairingBridge/PanicPairingFFI.xcframework
      embed: false
  PanicAnalyzerShare:
    type: app-extension
    platform: iOS
    sources:
    - path: ShareExtension
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: PanicAnalyzer
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 20
              NSExtensionActivationSupportsText: true
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
        - group.com.iosvn.panicanalyzer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iosvn.panicanalyzer.share
        CODE_SIGNING_REQUIRED: 'NO'
        CODE_SIGNING_ALLOWED: 'NO'
        CODE_SIGN_IDENTITY: ''
