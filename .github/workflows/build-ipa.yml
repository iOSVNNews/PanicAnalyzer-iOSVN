name: Build unsigned IPA

# Builds the installers only when native code changes. Interface fixes
# (web/) and diagnostic data (assets/) reach installed apps on their own:
# see web-update.yml and LogBridge.refreshRules.
#
# The IPA and TrollStore .tipa are published only when the app version
# (CFBundleShortVersionString in project.yml) changes. Any other native
# change is a general patch: only the jailbreak .deb packages are rebuilt and
# replaced in the latest release, under the IPA's version and build number,
# so IPA users are not asked to update.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'auto: IPA only when the version changes · jailbreak: .deb only · all: everything'
        type: choice
        options: [auto, jailbreak, all]
        default: auto
  push:
    branches: [main]
    paths-ignore:
      - 'web/**'
      - 'assets/**'
      - '**.md'
      - 'Tests/parts.test.js'
      - 'Tests/crash.test.js'
      - 'Tests/generations.test.js'
      - '.github/workflows/web-update.yml'

concurrency:
  group: build-ipa
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the interface build number counts web/ commits

      - name: Choose what to publish
        env:
          REQUESTED: ${{ github.event.inputs.publish || 'auto' }}
        run: |
          read -r NEW OLD OLD_BUILD <<< "$(python3 - <<'PY'
          import json, re
          new = re.search(r"CFBundleShortVersionString:\s*'?([^'\s]+)", open('project.yml').read()).group(1)
          try:
              recorded = json.load(open('assets/app_version.json'))
          except (OSError, ValueError):
              recorded = {}
          print(new, recorded.get('version') or '-', recorded.get('build') or '0')
          PY
          )"
          MODE="$REQUESTED"
          if [ "$MODE" = auto ]; then
            if [ "$NEW" != "$OLD" ]; then MODE=all; else MODE=jailbreak; fi
          fi
          if [ "$MODE" = jailbreak ] && [ "$NEW" != "$OLD" ]; then
            echo "::error::version $NEW is not released yet (latest IPA is $OLD); publish all"
            exit 1
          fi
          if [ "$MODE" = jailbreak ]; then BUILD="$OLD_BUILD"; else BUILD="$GITHUB_RUN_NUMBER"; fi
          echo "version $NEW (released: $OLD build $OLD_BUILD) -> publish $MODE, build number $BUILD"
          echo "PUBLISH=$MODE" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"

      - name: Select latest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "using: $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Run tests
        run: |
          swiftc Sources/Localization.swift Sources/LocalVPNConnection.swift Tests/LocalVPNConnectionTests.swift -o "$RUNNER_TEMP/vpn-tests"
          "$RUNNER_TEMP/vpn-tests"
          swiftc Sources/HardwareIdentity.swift Sources/LocalHardware.swift Tests/HardwareIdentityTests.swift -o "$RUNNER_TEMP/hw-tests"
          "$RUNNER_TEMP/hw-tests"
          node --check web/i18n.js
          node --check web/parts.js
          node --check web/app.js
          node Tests/parts.test.js
          node Tests/crash.test.js
          node Tests/generations.test.js
          python3 Tests/test_package_deb.py

      - name: Build Remote Pairing bridge
        run: |
          rustup target add aarch64-apple-ios
          cargo test --manifest-path PairingBridge/Cargo.toml --lib
          bash PairingBridge/build-xcframework.sh

      - name: Generate Xcode project
        run: |
          set +e
          xcodegen generate --spec project.yml > xcgen.log 2>&1
          rc=$?
          echo "::group::xcodegen"; cat xcgen.log; echo "::endgroup::"
          if [ ! -d PanicAnalyzer.xcodeproj ]; then
            echo "Could not generate .xcodeproj"
            head -30 xcgen.log | while IFS= read -r l; do echo "::error::XCGEN $l"; done
            exit 1
          fi

      - name: Prepare version info
        run: |
          APP_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Info.plist)
          RULES=$(python3 -c "import json;print(len(json.load(open('assets/panic_rules.json'))))")
          cat > assets/app_version.json <<EOF
          {
            "version": "$APP_VERSION",
            "build": "${BUILD_NUMBER}",
            "commit": "${GITHUB_SHA::7}",
            "rules": $RULES,
            "url": "https://github.com/${GITHUB_REPOSITORY}/releases/latest",
            "notes": "Bộ luật $RULES lỗi"
          }
          EOF
          cat assets/app_version.json
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "APP_BUILD=${BUILD_NUMBER}" >> $GITHUB_ENV
          # Interface build inside the installer; newer ones are downloaded.
          python3 scripts/web_manifest.py

      - name: Build (unsigned)
        run: |
          set +e
          xcodebuild \
            -project PanicAnalyzer.xcodeproj \
            -scheme PanicAnalyzer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            clean build > build.log 2>&1
          rc=$?
          echo "xcodebuild rc=$rc"
          if [ $rc -ne 0 ]; then
            echo "::group::Build log (tail)"; tail -120 build.log; echo "::endgroup::"
            grep -E "error:|fatal error:|xcodebuild:|Could not|not found" build.log \
              | sort -u | head -25 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: Package .ipa
        run: |
          APP=$(find build/Build/Products -maxdepth 2 -name "*.app" | head -1)
          echo "app: $APP"
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry PanicAnalyzer-unsigned.ipa Payload
          ls -lh PanicAnalyzer-unsigned.ipa
          VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist")
          if [ "$VER" != "$APP_VERSION" ] || [ "$BUILD" != "$APP_BUILD" ]; then
            echo "::error::IPA metadata is $VER ($BUILD), expected $APP_VERSION ($APP_BUILD)"
            exit 1
          fi

      - name: Package TrollStore and jailbreak builds
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products -maxdepth 2 -name "PanicAnalyzer.app" | head -1)
          SIGNED_APP="$RUNNER_TEMP/PanicAnalyzer.app"
          ditto "$APP" "$SIGNED_APP"
          /usr/libexec/PlistBuddy -c 'Add :PanicPrivilegedMode bool true' "$SIGNED_APP/Info.plist"
          codesign --force --sign - --timestamp=none \
            --entitlements packaging/ShareExtension.entitlements \
            "$SIGNED_APP/PlugIns/PanicAnalyzerShare.appex"
          codesign --force --sign - --timestamp=none \
            --entitlements packaging/Privileged.entitlements "$SIGNED_APP"
          codesign --verify --deep --strict "$SIGNED_APP"
          codesign -d --entitlements :- "$SIGNED_APP" > "$RUNNER_TEMP/app-entitlements.plist" 2>/dev/null
          python3 - "$RUNNER_TEMP/app-entitlements.plist" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], 'rb') as source:
              entitlements = plistlib.load(source)
          assert entitlements.get('platform-application') is True
          assert 'group.com.iosvn.panicanalyzer' in entitlements.get('com.apple.security.application-groups', [])
          assert '/var/mobile/Library/Logs/' in entitlements.get('com.apple.security.exception.files.absolute-path.read-only', [])
          assert 'com.apple.private.security.no-sandbox' not in entitlements
          PY
          mkdir -p "$RUNNER_TEMP/tipa/Payload"
          ditto "$SIGNED_APP" "$RUNNER_TEMP/tipa/Payload/PanicAnalyzer.app"
          (cd "$RUNNER_TEMP/tipa" && zip -qry "$GITHUB_WORKSPACE/PanicAnalyzer-TrollStore.tipa" Payload)
          python3 scripts/package_deb.py --app "$SIGNED_APP" \
            --rootless --output PanicAnalyzer-rootless.deb
          python3 scripts/package_deb.py --app "$SIGNED_APP" \
            --output PanicAnalyzer-rootful.deb
          python3 scripts/package_deb.py --app "$SIGNED_APP" \
            --scheme roothide --output PanicAnalyzer-roothide.deb
          python3 - PanicAnalyzer-rootless.deb PanicAnalyzer-rootful.deb PanicAnalyzer-roothide.deb <<'PY'
          from pathlib import Path
          import sys

          for filename in sys.argv[1:]:
              data = Path(filename).read_bytes()
              assert data.startswith(b'!<arch>\n'), filename
              cursor, names = 8, []
              while cursor < len(data):
                  header = data[cursor:cursor + 60]
                  assert len(header) == 60 and header[-2:] == b'`\n', filename
                  names.append(header[:16].decode().strip().rstrip('/'))
                  size = int(header[48:58].decode().strip())
                  cursor += 60 + size + size % 2
              assert cursor == len(data), filename
              assert names == ['debian-binary', 'control.tar.gz', 'data.tar.gz'], (filename, names)
              print(f'{filename}: {", ".join(names)}')
          PY
          unzip -tq PanicAnalyzer-TrollStore.tipa

      - uses: actions/upload-artifact@v4
        with:
          name: PanicAnalyzer-installers
          path: |
            PanicAnalyzer-unsigned.ipa
            PanicAnalyzer-TrollStore.tipa
            PanicAnalyzer-rootless.deb
            PanicAnalyzer-rootful.deb
            PanicAnalyzer-roothide.deb

      - name: Keep debug symbols (to read app crash reports)
        uses: actions/upload-artifact@v4
        with:
          name: PanicAnalyzer-dSYM-${{ github.run_number }}
          path: build/Build/Products/Release-iphoneos/*.dSYM
          if-no-files-found: warn
          retention-days: 90

      - name: Record version for the in-app update check
        if: env.PUBLISH == 'all'
        run: |
          # Written on top of the newest main (another build or the interface
          # workflow may have pushed meanwhile); an older build never
          # overwrites a newer one. web_update.json belongs to web-update.yml.
          cp assets/app_version.json "$RUNNER_TEMP/app_version.json"
          git checkout -- assets 2>/dev/null || true
          rm -f assets/web_update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git checkout -q -B main origin/main
            REMOTE_BUILD=$(python3 -c "import json;print(int(json.load(open('assets/app_version.json')).get('build') or 0))" 2>/dev/null || echo 0)
            if [ "$REMOTE_BUILD" -ge "$GITHUB_RUN_NUMBER" ]; then
              echo "main already records build $REMOTE_BUILD"
              exit 0
            fi
            cp "$RUNNER_TEMP/app_version.json" assets/app_version.json
            git add assets/app_version.json
            git commit -q -m "Version $APP_VERSION (build ${GITHUB_RUN_NUMBER})"
            git push origin HEAD:main && exit 0
            echo "retry $i"; sleep 5
          done
          echo "::error::Could not record the version on main"
          exit 1

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RULES=$(python3 -c "import json;print(len(json.load(open('assets/panic_rules.json'))))")
          IPA_COMMIT="${GITHUB_SHA::7}"
          if [ "$PUBLISH" = jailbreak ]; then
            IPA_COMMIT=$(git show origin/main:assets/app_version.json 2>/dev/null \
              | python3 -c "import json,sys;print(json.load(sys.stdin).get('commit',''))" || true)
          fi
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Automatic build from main · version $APP_VERSION (build $APP_BUILD) · $RULES diagnostic rules · IPA commit \`${IPA_COMMIT}\` · jailbreak packages commit \`${GITHUB_SHA::7}\`

          - **PanicAnalyzer-unsigned.ipa**: sign with your own certificate (ESign, Sideloadly, AltStore…)
          - **PanicAnalyzer-TrollStore.tipa**: install with TrollStore
          - **PanicAnalyzer-rootless.deb / -rootful.deb**: install with Sileo or Zebra on a jailbroken device
          - **PanicAnalyzer-roothide.deb**: roothide (Bootstrap, Dopamine roothide): install it directly, do not convert it with RootHide Patcher (the patcher removes the sandbox and the interface cannot load)
          EOF

          if [ "$PUBLISH" = jailbreak ]; then
            # General patch: the IPA and .tipa in the release stay as they are.
            gh release view latest >/dev/null
            gh release upload latest --clobber \
              PanicAnalyzer-rootless.deb PanicAnalyzer-rootful.deb PanicAnalyzer-roothide.deb
            gh release edit latest --notes-file "$RUNNER_TEMP/notes.md"
            gh release view latest --json assets --jq '.assets[] | "\(.name) \(.updatedAt)"'
            exit 0
          fi

          gh release delete latest --yes 2>/dev/null || true
          git push --delete origin latest 2>/dev/null || true
          # The full-history checkout also fetched the old tag; gh refuses to
          # create a release from a tag that exists only locally.
          git tag -d latest 2>/dev/null || true
          gh release create latest \
            PanicAnalyzer-unsigned.ipa PanicAnalyzer-TrollStore.tipa \
            PanicAnalyzer-rootless.deb PanicAnalyzer-rootful.deb PanicAnalyzer-roothide.deb \
            --title "PanicAnalyzer $APP_VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
